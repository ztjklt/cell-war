<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>器官地图 · 可爱几何风 · 独立预览</title>
<style>*{box-sizing:border-box}html,body{margin:0;height:100%}body{font:14px system-ui,-apple-system,sans-serif;background:#fff8ee;color:#684b56;display:flex;flex-direction:column}header{padding:14px 18px;background:#fffdf9;border-bottom:1px solid #ebddd7;flex:none}h1{font-size:19px;margin:0 0 9px}nav{display:flex;gap:6px;align-items:center;flex-wrap:wrap}button,select,a{font:inherit;border:1px solid #e7d3cf;border-radius:8px;padding:6px 11px;color:inherit;background:white;text-decoration:none;cursor:pointer}button:hover,a:hover{border-color:#ca8d91}button[aria-pressed=true]{background:#f8dfe2;border-color:#dba1aa}p{font-size:12px;color:#9b7c85;margin:10px 0 0;line-height:1.5}main{flex:1;min-height:180px;position:relative;overflow:hidden;touch-action:none;cursor:grab;background:#fff8ee}main.dragging{cursor:grabbing}#map{width:100%;height:100%;display:block}#status{position:absolute;left:12px;right:12px;bottom:12px;pointer-events:none;border-radius:8px;background:#fffcf4e8;color:#987680;padding:8px 10px;font-size:12px}.check{font-size:12px;white-space:nowrap}#sheet{position:absolute;inset:0;background:#fff8ee;overflow:auto;display:none;cursor:default}#sheet img{display:block;width:min(100%,1400px);margin:auto;height:auto}#sheet.open{display:block}#split{width:110px;accent-color:#cf8a9b}</style>
<header><h1>器官地图 · 可爱几何风 · 独立预览</h1><nav>
<button id="whole">全部器官位置</button><button id="catalog">十二器官总览</button><select id="organ"><option value="">定位到器官…</option></select><button id="new" aria-pressed="true">新画风</button><button id="old" aria-pressed="false">原图</button><button id="compare" aria-pressed="false">左右对照</button><input id="split" type="range" min="5" max="95" value="50" aria-label="对照分界位置"><button id="minus">−</button><button id="plus">＋</button><label class="check"><input id="outline" type="checkbox">原轮廓</label><a href="organ-layer-full-frame.svg" download>下载矢量图层</a></nav>
<p>滚轮放大 · 按住拖动 · 双击放大。12 个器官独立改绘，原外轮廓与地图位置固定。矢量图层可持续放大查看。<br>本页为独立美术预览；障碍物是视觉方案，当前游戏地图与碰撞数据保持原样。</p></header>
<main id="stage"><svg id="map" xmlns="http://www.w3.org/2000/svg" viewBox="350 8 315 822"><defs><clipPath id="compare-left"><rect id="left-rect"/></clipPath><clipPath id="compare-right"><rect id="right-rect"/></clipPath></defs><g id="original"></g><g id="styled"></g><g id="outlines" style="display:none"></g><line id="divider" stroke="#ca8292" stroke-width=".4" style="display:none"/></svg><div id="status">正在载入器官矢量图层…</div><div id="sheet"><img src="contact-sheet.svg" alt="12 个器官新画风总览"></div></main>
<script>
const $=s=>document.querySelector(s),svg=$('#map'),stage=$('#stage'),old=$('#original'),art=$('#styled'),edge=$('#outlines'),status=$('#status');let manifest=null,mode='new',box=[350,8,315,822],drag=null,loaded=false;
const ns='http://www.w3.org/2000/svg',names={brain:'脑',lung_r:'右肺',lung_l:'左肺',heart:'心脏',liver:'肝脏',stomach:'胃',pancreas:'胰腺',kidney_r:'右肾 · 凹陷地形',kidney_l:'左肾 · 凹陷地形',small_intestine:'小肠 · 战斗地形',large_intestine:'大肠 · 战斗地形',bladder:'膀胱'};
async function add(url,to){const r=await fetch(url);if(!r.ok)throw Error(url);const doc=new DOMParser().parseFromString(await r.text(),'image/svg+xml');if(doc.querySelector('parsererror'))throw Error('图层解析失败');for(const child of [...doc.documentElement.children])to.append(document.importNode(child,true))}
function point(e){return new DOMPoint(e.clientX,e.clientY).matrixTransform(svg.getScreenCTM().inverse())}
function draw(){svg.setAttribute('viewBox',box.join(' '));const mid=box[0]+box[2]*Number($('#split').value)/100;for(const[id,x,w]of[['left-rect',box[0],mid-box[0]],['right-rect',mid,box[0]+box[2]-mid]]){const r=$('#'+id);r.setAttribute('x',x);r.setAttribute('y',box[1]);r.setAttribute('width',w);r.setAttribute('height',box[3])}old.style.display=mode==='new'?'none':'';art.style.display=mode==='old'?'none':'';old.setAttribute('clip-path',mode==='compare'?'url(#compare-left)':'none');art.setAttribute('clip-path',mode==='compare'?'url(#compare-right)':'none');const line=$('#divider');line.style.display=mode==='compare'?'':'none';line.setAttribute('x1',mid);line.setAttribute('x2',mid);line.setAttribute('y1',box[1]);line.setAttribute('y2',box[1]+box[3]);for(const k of['new','old','compare'])$('#'+k).setAttribute('aria-pressed',String(mode===k));if(loaded)status.textContent=mode==='compare'?'左：原图　右：新画风 · 相同轮廓、相同位置':mode==='old'?'原始器官图层 · 同坐标对照':'新画风 · 原始轮廓固定 · 矢量细节可放大查看'}
function focus(b){$('#sheet').classList.remove('open');const w=b[2]-b[0],h=b[3]-b[1];box=[b[0]-w*.06,b[1]-h*.06,w*1.12,h*1.12];draw()}
function zoom(f,p){$('#sheet').classList.remove('open');if(box[2]*f<2||box[2]*f>1800)return;p=p||{x:box[0]+box[2]/2,y:box[1]+box[3]/2};box=[p.x+(box[0]-p.x)*f,p.y+(box[1]-p.y)*f,box[2]*f,box[3]*f];draw()}
$('#whole').onclick=()=>focus([350,8,665,830]);$('#catalog').onclick=()=>$('#sheet').classList.toggle('open');$('#organ').onchange=e=>{const o=manifest?.organs.find(o=>o.id===e.target.value);if(o)focus(o.sourceBox)};for(const k of['new','old','compare'])$('#'+k).onclick=()=>{mode=k;$('#sheet').classList.remove('open');draw()};$('#split').oninput=draw;$('#outline').onchange=e=>edge.style.display=e.target.checked?'':'none';$('#minus').onclick=()=>zoom(1.35);$('#plus').onclick=()=>zoom(1/1.35);
svg.addEventListener('wheel',e=>{e.preventDefault();zoom(Math.exp(e.deltaY*.0015),point(e))},{passive:false});svg.addEventListener('dblclick',e=>zoom(.65,point(e)));svg.addEventListener('pointerdown',e=>{if(e.button!==0)return;drag={id:e.pointerId,at:point(e),box:[...box]};svg.setPointerCapture(e.pointerId);stage.classList.add('dragging')});svg.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;const p=point(e);box[0]+=drag.at.x-p.x;box[1]+=drag.at.y-p.y;draw()});function release(){drag=null;stage.classList.remove('dragging')}svg.addEventListener('pointerup',release);svg.addEventListener('pointercancel',release);
Promise.all([fetch('manifest.json').then(r=>r.json()),add('organs-styled.svg',art),add('organs-original.svg',old),add('original-outlines.svg',edge)]).then(([m])=>{manifest=m;for(const[id,name]of Object.entries(names)){const op=document.createElement('option');op.value=id;op.textContent=name;$('#organ').append(op)}loaded=true;const target=new URLSearchParams(location.search).get('organ')||'kidney_r';$('#organ').value=target;const o=m.organs.find(o=>o.id===target);if(o)focus(o.sourceBox);else draw()}).catch(e=>{status.textContent='图层载入失败，请刷新页面：'+e.message});draw();
</script></html>
