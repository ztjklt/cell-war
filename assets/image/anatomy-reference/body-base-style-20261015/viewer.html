<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>人体底图 · 肌肉与骨骼 · 可爱几何风</title>
<style>*{box-sizing:border-box}body{margin:0;background:#fff8f1;color:#754c52;font:15px system-ui,sans-serif}header{padding:16px 22px;background:#fffdfa;border-bottom:1px solid #eddacf}h1{font-size:20px;margin:0 0 8px}p{margin:6px 0 12px;color:#9b7274}nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button,a{font:inherit;border:1px solid #e8cdc5;background:white;color:#84525b;border-radius:10px;padding:8px 12px;text-decoration:none;cursor:pointer}button.on{background:#f9d8d0;border-color:#dcaea2}label{display:inline-flex;align-items:center;gap:5px}main{height:calc(100vh - 155px);min-height:400px;overflow:hidden;touch-action:none;background:repeating-conic-gradient(#fffdfb 0 25%,#fbf3ed 0 50%) 0/24px 24px;cursor:grab}main:active{cursor:grabbing}#scene{width:100%;height:100%;display:block;user-select:none}footer{position:fixed;bottom:12px;left:15px;background:#fffdfbdc;padding:7px 12px;border-radius:8px;font-size:13px;pointer-events:none}input{accent-color:#c87778}</style>
<header><h1>人体底图 · 肌肉与骨骼</h1><p>保留原人体外轮廓与主要结构，细化为温暖、可爱的几何画风。</p><nav><button id="new" class="on">新版底图</button><button id="original">原始底图</button><label><input id="outline" type="checkbox">轮廓对照</label><label><input id="overlay" type="checkbox">叠加器官、通道和血管</label><button id="minus">−</button><button id="plus">＋</button><button id="reset">重置视图</button><a href="body-base.svg" download>下载独立图层</a></nav></header>
<main><svg id="scene" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1536"><g id="base"></g><image id="connections" href="../anatomy-v1/connections.svg" x="0" y="0" width="1024" height="1536" style="display:none"/><g id="organs" style="display:none"><image href="../organs-v1/organs-styled.svg" x="350" y="8" width="315" height="822"/></g><image id="mouths" href="../anatomy-v1/connection-mouths.svg" x="0" y="0" width="1024" height="1536" style="display:none"/><g id="vessels" style="display:none"></g><image id="outlineImage" href="body-outline.svg" x="0" y="0" width="1024" height="1536" style="display:none"/></svg></main><footer id="hint">滚轮放大 · 拖动平移 · 新底图与独立连接通道已接入游戏</footer>
<script>const $=id=>document.getElementById(id),scene=$('scene'),area=document.querySelector('main');let box=[0,0,1024,1536],drag=null,vesselTiles=[],vesselKey='';const paint=()=>{scene.setAttribute('viewBox',box.join(' '));updateVessels()};async function load(file){const xml=new DOMParser().parseFromString(await(await fetch(file)).text(),'image/svg+xml');$('base').replaceChildren(...Array.from(xml.documentElement.children).map(x=>document.importNode(x,true)))}load('body-base.svg');for(const[id,file]of[['new','body-base.svg'],['original','body-original.svg']])$(id).onclick=()=>{load(file);$('new').classList.toggle('on',id==='new');$('original').classList.toggle('on',id==='original')};$('outline').onchange=e=>$('outlineImage').style.display=e.target.checked?'':'none';$('overlay').onchange=e=>{for(const id of ['connections','organs','mouths','vessels'])$(id).style.display=e.target.checked?'':'none';updateVessels()};function updateVessels(){if(!$('overlay').checked||!vesselTiles.length)return;const scale=scene.getScreenCTM().a*devicePixelRatio,level=[4,8,16,32].find(n=>n>=scale)||32;const visible=vesselTiles.filter(t=>t.x+t.w>=box[0]&&t.x<=box[0]+box[2]&&t.y+t.h>=box[1]&&t.y<=box[1]+box[3]);let key=level+':'+visible.map(t=>t.name).join(',');if(key===vesselKey)return;vesselKey=key;$('vessels').replaceChildren(...visible.map(t=>{const image=document.createElementNS('http://www.w3.org/2000/svg','image');for(const[k,v]of Object.entries({href:'../channels-v3/l'+level+'/'+t.name,x:t.x,y:t.y,width:t.w,height:t.h}))image.setAttribute(k,v);return image}))}fetch('../channels-v3/manifest.json').then(r=>r.json()).then(m=>{vesselTiles=m.tiles;updateVessels()});function zoom(f,x,y){let rect=area.getBoundingClientRect();let p=new DOMPoint(x??rect.left+rect.width/2,y??rect.top+rect.height/2).matrixTransform(scene.getScreenCTM().inverse());box=[p.x-(p.x-box[0])/f,p.y-(p.y-box[1])/f,box[2]/f,box[3]/f];paint()}$('plus').onclick=()=>zoom(1.4);$('minus').onclick=()=>zoom(1/1.4);$('reset').onclick=()=>{box=[0,0,1024,1536];paint()};area.onwheel=e=>{e.preventDefault();zoom(Math.exp(-e.deltaY*.0015),e.clientX,e.clientY)};area.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,box:[...box],matrix:scene.getScreenCTM().inverse()};area.setPointerCapture(e.pointerId)};area.onpointermove=e=>{if(!drag)return;let a=new DOMPoint(drag.x,drag.y).matrixTransform(drag.matrix),b=new DOMPoint(e.clientX,e.clientY).matrixTransform(drag.matrix);box=[drag.box[0]+a.x-b.x,drag.box[1]+a.y-b.y,drag.box[2],drag.box[3]];paint()};area.onpointerup=()=>drag=null;</script></html>
