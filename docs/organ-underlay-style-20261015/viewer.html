<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>细胞战争 · 图层透视</title>
<style>*{box-sizing:border-box}body{margin:0;background:#fff9f3;color:#754c52;font:14px system-ui,sans-serif}header{padding:12px 16px;background:#fffdfa;border-bottom:1px solid #eddacf}h1{font-size:18px;margin:0 0 6px}p{margin:4px 0 9px;color:#9b7274}nav{display:flex;gap:7px;align-items:center;flex-wrap:wrap}button,a{font:inherit;border:1px solid #e8cdc5;background:white;color:#84525b;border-radius:9px;padding:6px 9px;text-decoration:none;cursor:pointer}label{display:inline-flex;align-items:center;gap:3px}input{accent-color:#bf737e}main{height:calc(100dvh - var(--head,170px));min-height:300px;overflow:hidden;touch-action:none;background:repeating-conic-gradient(#fffdfb 0 25%,#fbf3ed 0 50%) 0/24px 24px;cursor:grab}main:active{cursor:grabbing}svg{width:100%;height:100%;display:block;user-select:none}#scene>image,#blood,#checkpoints{transition:opacity .75s ease-in-out}footer{position:fixed;bottom:7px;left:8px;background:#fffdfbdd;padding:5px 8px;border-radius:7px;font-size:11px;pointer-events:none}</style>
<header><h1>细胞战争 · 图层透视</h1><p id="viewHint">所有图层正常显示。</p><nav><button id="perspective">切换透视 · 全图</button><button id="fadedView">血管虚化</button><label><input id="checkpointToggle" type="checkbox" checked>血管关口</label><button id="checkpointDetail">关口细节</button><label><input id="obstacleToggle" type="checkbox">障碍轮廓</label><button id="obstacleDetail">障碍细节</button><label><input id="bodyToggle" type="checkbox" checked>底图</label><label><input id="underlayToggle" type="checkbox" checked>中间衬底</label><label><input id="organToggle" type="checkbox" checked>器官地图</label><label><input id="bloodToggle" type="checkbox" checked>血管</label><label><input id="originalToggle" type="checkbox">原图</label><button id="whole">全身</button><button id="torso">胸腹整体</button><button id="spine">脊椎衔接</button><button id="digestive">胃肠细节</button><button id="isolated">单看中间层</button><button id="minus">−</button><button id="plus">＋</button><a href="organ-underlay.svg" download>下载中间层</a></nav></header>
<main><svg id="scene" xmlns="http://www.w3.org/2000/svg" viewBox="340 255 335 590"><image id="body" href="../anatomy-v1/body-base.svg?spine=v3" x="0" y="0" width="1024" height="1536"/><image id="underlay" href="organ-underlay.svg" x="0" y="0" width="1024" height="1536"/><image id="organs" href="../organs-v1/organs-styled.svg" x="350" y="8" width="315" height="822"/><g id="obstacles" style="display:none"></g><g id="blood"></g><image id="original" href="original-reference.png" x="0" y="0" width="1024" height="1536" style="opacity:0"/><g id="checkpoints"></g></svg></main><footer>美术分布预览 · 每段紫色血管两个关口 · 攻防在游戏中运行</footer>
<script>
const $=id=>document.getElementById(id),scene=$('scene'),area=document.querySelector('main');let box=[340,255,335,590],drag=null,tiles=[],tileKey='';
new ResizeObserver(()=>document.body.style.setProperty('--head',document.querySelector('header').offsetHeight+'px')).observe(document.querySelector('header'));
function drawBlood(){if(!$('bloodToggle').checked||!tiles.length)return;const ctm=scene.getScreenCTM(),ratio=ctm.a*devicePixelRatio,level=[4,8,16,32].find(n=>n>=ratio)||32;const rect=area.getBoundingClientRect(),inv=ctm.inverse(),a=new DOMPoint(rect.left,rect.top).matrixTransform(inv),b=new DOMPoint(rect.right,rect.bottom).matrixTransform(inv);const visible=tiles.filter(t=>t.x+t.w>=a.x&&t.x<=b.x&&t.y+t.h>=a.y&&t.y<=b.y);const key=level+':'+visible.map(t=>t.name).join(',');if(key===tileKey)return;tileKey=key;$('blood').replaceChildren(...visible.map(t=>{const im=document.createElementNS('http://www.w3.org/2000/svg','image');for(const[k,v]of Object.entries({href:'../channels-v3/l'+level+'/'+t.name,x:t.x,y:t.y,width:t.w,height:t.h}))im.setAttribute(k,v);return im}))}
function paint(){scene.setAttribute('viewBox',box.join(' '));drawBlood()}
function layers(){for(const[id,toggle]of[['body','bodyToggle'],['underlay','underlayToggle'],['organs','organToggle'],['blood','bloodToggle'],['original','originalToggle']]){ $(id).style.display='';if(!$(toggle).checked)$(id).style.opacity=0 }$('checkpoints').style.opacity=$('checkpointToggle').checked?(1-Number($('original').style.opacity||0)):0;drawBlood()}
const layerIds=['body','underlay','organs','blood','original'],toggleIds=['bodyToggle','underlayToggle','organToggle','bloodToggle','originalToggle'];
const views=[
 {id:'map',name:'全图',alpha:[1,1,1,1,0],hint:'所有图层正常显示。'},
 {id:'faded',name:'血管虚化',alpha:[1,1,1,.18,0],hint:'保留完整地图，血管半透明显示，方便查看器官战场。游戏内血管仍可正常通行。'},
 {id:'organs',name:'器官',alpha:[.18,0,1,0,0],hint:'突出器官战场，淡化人体底图。'},
 {id:'vessels',name:'血管',alpha:[.14,0,0,1,0],hint:'突出完整血管网络。'},
 {id:'underlay',name:'中间衬底',alpha:[.18,1,0,0,0],hint:'查看器官背面与连接处的中间衬底。'},
 {id:'body',name:'肌肉骨骼',alpha:[1,0,0,0,0],hint:'查看人体底图、肌肉与骨骼。'},
 {id:'original',name:'原图',alpha:[1,1,1,1,1],hint:'原图保持与其他图层相同的位置和缩放，切换时平滑浮现。'}
];
let viewIndex=0;
$('checkpointToggle').onchange=layers;
$('obstacleDetail').onclick=()=>{setView(2);$('obstacleToggle').checked=true;$('obstacles').style.display='';box=[572,566,57,89];paint()};
$('obstacleToggle').onchange=()=>{$('obstacles').style.display=$('obstacleToggle').checked?'':'none'};
fetch('obstacles.json').then(r=>r.json()).then(rows=>{for(const row of rows)for(const q of row.obstacleRings){const path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('d',[q.outer,...q.holes].map(r=>'M '+r.map(p=>p.join(',')).join(' L ')+' Z').join(' '));path.setAttribute('fill','#754dde');path.setAttribute('fill-opacity','.28');path.setAttribute('fill-rule','evenodd');path.setAttribute('stroke','#5431af');path.setAttribute('stroke-width','.15');$('obstacles').append(path)}});
$('checkpointDetail').onclick=()=>{setView(0);box=[530,574,23,23];paint()};
fetch('checkpoints.json').then(r=>r.json()).then(ports=>{$('checkpoints').replaceChildren(...ports.map(p=>{const g=document.createElementNS('http://www.w3.org/2000/svg','g'),im=document.createElementNS('http://www.w3.org/2000/svg','image'),title=document.createElementNS('http://www.w3.org/2000/svg','title');g.setAttribute('transform',`translate(${p.a[0]},${p.a[1]}) rotate(${Math.atan2(p.tangent[1],p.tangent[0])*180/Math.PI+90})`);const organNames={brain:'脑',lung_r:'右肺',lung_l:'左肺',heart:'心脏',liver:'肝脏',pancreas:'胰脏',kidney_r:'右肾',kidney_l:'左肾',large_intestine:'大肠',small_intestine:'小肠',bladder:'膀胱',stomach:'胃'};title.textContent=`${organNames[p.organId]} · 血管关口 · 防守中`;for(const [k,v]of Object.entries({href:'checkpoint-hex-purple-v3.png',x:-3.3,y:-3.3,width:6.6,height:6.6}))im.setAttribute(k,v);g.append(title,im);return g}))});
function setView(index){viewIndex=index;const v=views[index];layerIds.forEach((id,i)=>{$(toggleIds[i]).checked=v.alpha[i]>0;$(id).style.opacity=v.alpha[i]});$('perspective').textContent='切换透视 · '+v.name;$('viewHint').textContent=v.hint;layers()}
$('perspective').onclick=()=>setView((viewIndex+1)%views.length);
$('fadedView').onclick=()=>setView(1);
for(const id of toggleIds)$(id).onchange=()=>{layerIds.forEach(id=>$(id).style.opacity=1);viewIndex=-1;$('perspective').textContent='切换透视 · 自选';$('viewHint').textContent='自选图层显示。';layers()};
setView(Math.max(0,views.findIndex(v=>v.id===new URLSearchParams(location.search).get('view'))));
fetch('../channels-v3/manifest.json').then(r=>r.json()).then(m=>{tiles=m.tiles;drawBlood()});
for(const[id,b]of Object.entries({whole:[0,0,1024,1536],torso:[340,255,335,590],spine:[465,140,90,235],digestive:[385,440,255,330]}))$(id).onclick=()=>{box=[...b];paint()};
$('isolated').onclick=()=>{setView(4);box=[350,270,315,560];paint()};
function zoom(f,x,y){const r=area.getBoundingClientRect(),p=new DOMPoint(x??r.left+r.width/2,y??r.top+r.height/2).matrixTransform(scene.getScreenCTM().inverse());box=[p.x-(p.x-box[0])/f,p.y-(p.y-box[1])/f,box[2]/f,box[3]/f];paint()}
$('plus').onclick=()=>zoom(1.4);$('minus').onclick=()=>zoom(1/1.4);area.onwheel=e=>{e.preventDefault();zoom(Math.exp(-e.deltaY*.0015),e.clientX,e.clientY)};area.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,box:[...box],matrix:scene.getScreenCTM().inverse()};area.setPointerCapture(e.pointerId)};area.onpointermove=e=>{if(!drag)return;const a=new DOMPoint(drag.x,drag.y).matrixTransform(drag.matrix),b=new DOMPoint(e.clientX,e.clientY).matrixTransform(drag.matrix);box=[drag.box[0]+a.x-b.x,drag.box[1]+a.y-b.y,drag.box[2],drag.box[3]];paint()};area.onpointerup=()=>drag=null;window.onresize=drawBlood;
</script></html>
