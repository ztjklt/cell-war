<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>细胞战争 · 完整地图分层预览</title>
<style>*{box-sizing:border-box}body{margin:0;background:#fff8f1;color:#754c52;font:14px system-ui,sans-serif}header{padding:14px 18px;background:#fffdfa;border-bottom:1px solid #eddacf}h1{font-size:19px;margin:0 0 8px}p{margin:5px 0 10px;color:#9b7274}nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button,a{font:inherit;border:1px solid #e8cdc5;background:white;color:#84525b;border-radius:9px;padding:7px 10px;text-decoration:none;cursor:pointer}label{display:inline-flex;align-items:center;gap:4px;padding:5px}input{accent-color:#c87778}main{height:calc(100vh - 180px);min-height:380px;overflow:hidden;touch-action:none;background:repeating-conic-gradient(#fffdfb 0 25%,#fbf3ed 0 50%) 0/24px 24px;cursor:grab}main:active{cursor:grabbing}svg{width:100%;height:100%;display:block;user-select:none}footer{position:fixed;bottom:10px;left:12px;background:#fffdfbdd;padding:6px 10px;border-radius:8px;font-size:12px;pointer-events:none}</style>
<header><h1>完整地图 · 器官与血管双向入口</h1><p>底图 → 器官连接 → 器官 → 血管 → 入口短接段；入口为可通行的敞口地面。</p><nav><label><input id="bodyToggle" type="checkbox" checked>底图</label><label><input id="connectionToggle" type="checkbox" checked>连接通道</label><label><input id="organToggle" type="checkbox" checked>器官</label><label><input id="bloodToggle" type="checkbox" checked>血管</label><label><input id="portToggle" type="checkbox" checked>血管入口</label><button id="portDetail">入口特写</button><select id="organSelect" aria-label="查看器官入口"><option value="">查看器官入口</option></select><button id="whole">全身</button><button id="chest">气道连接</button><button id="stomach">胃肠连接</button><button id="urine">肾与膀胱</button><button id="minus">−</button><button id="plus">＋</button><a href="connections.svg" download>下载连接层</a></nav></header>
<main><svg id="scene" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1536"><g id="body"></g><image id="connections" href="connections.svg" x="0" y="0" width="1024" height="1536"/><image id="organs" href="../organs-v1/organs-styled.svg" x="350" y="8" width="315" height="822"/><image id="mouths" href="connection-mouths.svg" x="0" y="0" width="1024" height="1536"/><g id="blood"></g><image id="ports" href="blood-ports.svg" x="0" y="0" width="1024" height="1536"/></svg></main><footer>滚轮放大 · 拖动平移 · 血管入口为独立矢量层 · 两侧护边、中间敞口 · 入口配色随相接血管衔接</footer>
<script>
const $=id=>document.getElementById(id),scene=$('scene'),area=document.querySelector('main');let box=[0,0,1024,1536],drag=null,tiles=[],tileKey='';
fetch('body-base.svg').then(r=>r.text()).then(text=>{const xml=new DOMParser().parseFromString(text,'image/svg+xml');$('body').replaceChildren(...Array.from(xml.documentElement.children).map(q=>document.importNode(q,true)))});
function drawBlood(){if(!$('bloodToggle').checked||!tiles.length)return;const level=[4,8,16,32].find(n=>n>=scene.getScreenCTM().a*devicePixelRatio)||32;const visible=tiles.filter(t=>t.x+t.w>=box[0]&&t.x<=box[0]+box[2]&&t.y+t.h>=box[1]&&t.y<=box[1]+box[3]);const key=level+':'+visible.map(t=>t.name).join(',');if(key===tileKey)return;tileKey=key;$('blood').replaceChildren(...visible.map(t=>{const im=document.createElementNS('http://www.w3.org/2000/svg','image');for(const[k,v]of Object.entries({href:'../channels-v3/l'+level+'/'+t.name,x:t.x,y:t.y,width:t.w,height:t.h}))im.setAttribute(k,v);return im}))}
function paint(){scene.setAttribute('viewBox',box.join(' '));drawBlood()}
function layers(){for(const[id,toggle]of[['body','bodyToggle'],['connections','connectionToggle'],['organs','organToggle'],['blood','bloodToggle'],['ports','portToggle']])$(id).style.display=$(toggle).checked?'':'none';$('mouths').style.display=$('connectionToggle').checked&&$('organToggle').checked?'':'none';drawBlood()}
for(const id of ['bodyToggle','connectionToggle','organToggle','bloodToggle','portToggle'])$(id).onchange=layers;
fetch('../channels-v3/manifest.json').then(r=>r.json()).then(m=>{tiles=m.tiles;drawBlood()});
for(const[id,b]of Object.entries({whole:[0,0,1024,1536],chest:[365,125,290,370],stomach:[390,435,260,315],urine:[380,545,265,285]}))$(id).onclick=()=>{box=[...b];paint()};
function zoom(f,x,y){const r=area.getBoundingClientRect(),p=new DOMPoint(x??r.left+r.width/2,y??r.top+r.height/2).matrixTransform(scene.getScreenCTM().inverse());box=[p.x-(p.x-box[0])/f,p.y-(p.y-box[1])/f,box[2]/f,box[3]/f];paint()}
$('portDetail').onclick=()=>{box=[582,619,16,13];paint()};
const organNames={brain:'脑',lung_r:'右肺',lung_l:'左肺',heart:'心脏',liver:'肝脏',stomach:'胃',pancreas:'胰',kidney_r:'右肾',kidney_l:'左肾',small_intestine:'小肠',large_intestine:'大肠',bladder:'膀胱'};let portRows=[];fetch('blood-ports.json').then(r=>r.json()).then(data=>{portRows=data.ports;for(const[id,name]of Object.entries(organNames)){const q=document.createElement('option');q.value=id;q.textContent=name+' · '+portRows.filter(p=>p.organId===id).length+' 个入口';$('organSelect').append(q)}});$('organSelect').onchange=()=>{const ps=portRows.filter(p=>p.organId===$('organSelect').value);if(!ps.length)return;const xs=ps.flatMap(p=>[p.a[0],p.b[0]]),ys=ps.flatMap(p=>[p.a[1],p.b[1]]);box=[Math.min(...xs)-10,Math.min(...ys)-10,Math.max(...xs)-Math.min(...xs)+20,Math.max(...ys)-Math.min(...ys)+20];paint()};
$('plus').onclick=()=>zoom(1.4);$('minus').onclick=()=>zoom(1/1.4);area.onwheel=e=>{e.preventDefault();zoom(Math.exp(-e.deltaY*.0015),e.clientX,e.clientY)};area.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,box:[...box],matrix:scene.getScreenCTM().inverse()};area.setPointerCapture(e.pointerId)};area.onpointermove=e=>{if(!drag)return;const a=new DOMPoint(drag.x,drag.y).matrixTransform(drag.matrix),b=new DOMPoint(e.clientX,e.clientY).matrixTransform(drag.matrix);box=[drag.box[0]+a.x-b.x,drag.box[1]+a.y-b.y,drag.box[2],drag.box[3]];paint()};area.onpointerup=()=>drag=null;
</script></html>
