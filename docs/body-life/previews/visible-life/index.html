<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>心跳与血流</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f4f0e9;color:#302e2d;font:15px system-ui,sans-serif}main{max-width:1060px;margin:auto;padding:16px}h1{font-size:22px;margin:0 0 8px}p{color:#625f5a;line-height:1.6}select,button{font:inherit;padding:10px;border:1px solid #c6c4bd;border-radius:8px;background:white;color:inherit}button{cursor:pointer}#toggle{background:#27675e;color:white;border:0}.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0}.stage{position:relative;overflow:hidden;background:white;border-radius:12px;touch-action:none}canvas{width:100%;height:auto;display:block;cursor:grab}.transport{display:flex;align-items:center;gap:12px;margin:12px 0}input[type=range]{flex:1;min-width:90px;accent-color:#27675e}#clock{font-variant-numeric:tabular-nums;white-space:nowrap;font-size:13px}#status{font-size:13px;color:#45665e}details{margin-top:16px;color:#777;font-size:12px}.hint{font-size:12px;margin:8px 0}label{font-size:13px}.toolbar{position:sticky;top:0;background:#f4f0e9;z-index:2;padding:6px 0}@media(max-width:480px){main{padding:12px}h1{font-size:20px}.controls select{width:100%}}</style>
<main><h1>心跳与血流</h1><p><a href="fill.html" style="color:#a6e1d2">查看填色地图与实际细胞对照</a></p><p>保留心脏跳动与血管流动，其他器官恢复原来的静态外观。可暂停、拖动时间或放大查看。</p><div class="toolbar"><div class="controls"><select id="view" aria-label="选择器官或视角"></select><button id="toggle">暂停</button><button id="zoomIn" aria-label="放大画面">＋</button><button id="zoomOut" aria-label="缩小画面">－</button><button id="reset">适合窗口</button><label><input type="checkbox" id="difference"> 显示变化区域</label></div><div class="transport"><input id="time" aria-label="动画时间" type="range" min="0" max="179" value="0"><span id="clock">0.00 秒</span></div><div id="status">正在加载逐帧画面…</div></div><div class="stage"><canvas id="stage" width="720" height="600"></canvas></div><p class="hint">滚轮放大 · 拖动平移 · “显示变化区域”仅辅助定位动画，不改变游戏效果。</p><details><summary>预览说明</summary><p>这些画面来自游戏 Lua 绘制代码的固定时间输出，逐帧播放，不依赖视频自动播放。预览用于检查动态、边界与组织细节；不是原生窗口录屏。</p></details></main>
<script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),select=document.querySelector('#view'),slider=document.querySelector('#time'),clock=document.querySelector('#clock'),status=document.querySelector('#status'),toggle=document.querySelector('#toggle'),diff=document.querySelector('#difference');
let catalog=[],entry,frames=[],playing=true,index=0,start=performance.now(),zoom=1,panX=0,panY=0,drag=null,generation=0,lastRendered=-1;
const base=document.createElement('canvas'),bc=base.getContext('2d',{willReadFrequently:true});let baseData=null;
function draw(force=false){if(!entry||!frames[index]?.complete||!frames[index].naturalWidth)return;if(!force&&lastRendered===index)return;lastRendered=index;ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='white';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.translate(canvas.width/2+panX,canvas.height/2+panY);ctx.scale(zoom,zoom);ctx.drawImage(frames[index],-canvas.width/2,-canvas.height/2,canvas.width,canvas.height);if(diff.checked&&baseData){bc.drawImage(frames[index],0,0,base.width,base.height);const d=bc.getImageData(0,0,base.width,base.height);for(let i=0;i<d.data.length;i+=4){const delta=Math.max(Math.abs(d.data[i]-baseData[i]),Math.abs(d.data[i+1]-baseData[i+1]),Math.abs(d.data[i+2]-baseData[i+2]));d.data[i]=220;d.data[i+1]=55;d.data[i+2]=55;d.data[i+3]=delta>5?180:0}bc.putImageData(d,0,0);ctx.drawImage(base,-canvas.width/2,-canvas.height/2,canvas.width,canvas.height)}ctx.setTransform(1,0,0,1,0,0);slider.value=index;clock.textContent=(index/entry.fps).toFixed(2)+' 秒';}
async function load(){const token=++generation,seconds=entry?index/entry.fps:0;entry=catalog[select.selectedIndex];frames=[];baseData=null;index=Math.min(entry.frames-1,Math.floor(seconds*entry.fps));start=performance.now()-index/entry.fps*1000;lastRendered=-1;zoom=1;panX=panY=0;canvas.width=entry.width;canvas.height=entry.height;base.width=entry.width;base.height=entry.height;slider.max=entry.frames-1;status.textContent='正在加载 '+entry.label+'…';let loaded=0;await Promise.all(Array.from({length:entry.frames},(_,i)=>new Promise(resolve=>{const img=new Image();frames[i]=img;img.onload=()=>{if(token===generation){loaded++;status.textContent=entry.label+' · '+loaded+'/'+entry.frames+' 帧';if(i===0){bc.drawImage(img,0,0);baseData=bc.getImageData(0,0,base.width,base.height).data;draw(true)}}resolve()};img.onerror=resolve;img.src=entry.folder+'/'+String(i).padStart(3,'0')+'.jpg'})));if(token!==generation)return;start=performance.now()-index/entry.fps*1000;draw(true);status.textContent=entry.label+' · '+(loaded===entry.frames?(playing?'画面已加载，连续播放':'画面已加载，已暂停'):'部分画面加载失败，请刷新');}
function tick(t){if(playing&&entry){index=Math.floor((t-start)/1000*entry.fps)%entry.frames;draw()}requestAnimationFrame(tick)}
select.onchange=load;toggle.onclick=()=>{playing=!playing;start=performance.now()-index/entry.fps*1000;toggle.textContent=playing?'暂停':'播放';status.textContent=entry.label+' · '+(playing?'连续播放':'已暂停')};slider.oninput=()=>{playing=false;toggle.textContent='播放';index=Number(slider.value);status.textContent=entry.label+' · 已暂停';draw(true)};diff.onchange=()=>draw(true);document.querySelector('#reset').onclick=()=>{zoom=1;panX=panY=0;draw(true)};
document.querySelector('#zoomIn').onclick=()=>{zoom=Math.min(6,zoom*1.5);draw(true)};document.querySelector('#zoomOut').onclick=()=>{zoom=Math.max(1,zoom/1.5);draw(true)};canvas.onwheel=e=>{e.preventDefault();zoom=Math.max(1,Math.min(6,zoom*Math.exp(-e.deltaY*.001)));draw(true)};canvas.onpointerdown=e=>{drag=[e.clientX,e.clientY,panX,panY];canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(!drag)return;const k=canvas.width/canvas.clientWidth;panX=drag[2]+(e.clientX-drag[0])*k;panY=drag[3]+(e.clientY-drag[1])*k;draw(true)};canvas.onpointerup=()=>drag=null;
fetch('catalog.json').then(r=>r.json()).then(data=>{catalog=data;select.innerHTML=data.map(x=>'<option>'+x.label+'</option>').join('');load();requestAnimationFrame(tick)}).catch(()=>status.textContent='画面目录加载失败，请刷新。');
</script></html>
