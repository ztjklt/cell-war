<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>填色地图 · 实际细胞对照</title>
<style>body{margin:0;background:#17212a;color:#e9edf0;font:14px system-ui}main{max-width:1040px;margin:auto;padding:16px}h1{font-size:20px;margin:0 0 8px}p{color:#b7c5ce;line-height:1.6}label{display:inline-block;margin:5px 8px 5px 0}select,button,a{font:inherit;color:inherit}select,button{background:#273742;border:1px solid #5c717e;border-radius:6px;padding:8px}button[aria-pressed=true]{background:#326858;border-color:#9bddc2}img{width:100%;display:block;border-radius:8px;margin:12px 0}nav{display:flex;flex-wrap:wrap;gap:8px}small{color:#b7c5ce}a{color:#a6e1d2}</style>
<main><h1>填色地图 · 实际细胞对照</h1><p>保留原图的器官形状与大明暗，修顺边缘，清掉重复的细胞核和波纹装饰。心跳与血流保留。</p>
<label>部位 <select id="organ" aria-label="部位"></select></label><label>游戏缩放 <select id="zoom" aria-label="游戏缩放"><option value="0.15">0.15 · 完全填色</option><option value="0.4" selected>0.4 · 局部</option><option value="0.9">0.9 · 指挥近景</option><option value="2.8">2.8 · 最大放大</option></select></label>
<nav><button id="after" aria-pressed="true">现在</button><button id="before" aria-pressed="false">原来</button></nav>
<img id="map" alt="实际游戏填色地图与细胞"><div id="caption"></div><p><a id="full" target="_blank">打开原尺寸画面</a> · <a href="index.html">观看心跳与血流</a></p><small>固定时间的 Lua 游戏渲染对照；页面会适应面板宽度。原生抗锯齿和帧率需在游戏窗口确认。</small></main>
<script>let stage='after';const organ=document.querySelector('#organ'),zoom=document.querySelector('#zoom'),image=document.querySelector('#map'),caption=document.querySelector('#caption'),full=document.querySelector('#full');let records=[];
function update(){const r=records.find(r=>r.id===`${organ.value}-z${Number(zoom.value)}`);if(!r)return;image.src=`fill-images/${stage}/${r.file}`;full.href=image.src;caption.textContent=`${stage==='after'?'现在':'原来'} · ${r.label} · zoom ${r.zoom} · 同一组 ${r.units} 个实际细胞 · 原尺寸 800 × 540`;for(const s of ['after','before'])document.getElementById(s).setAttribute('aria-pressed',s===stage);}
for(const s of ['after','before'])document.getElementById(s).onclick=()=>{stage=s;update()};organ.onchange=zoom.onchange=update;
fetch('fill-catalog.json').then(r=>r.json()).then(data=>{records=data;for(const r of records.filter(r=>r.zoom===.15)){let o=document.createElement('option');o.value=r.id.split('-z')[0];o.textContent=r.label;organ.append(o)}organ.value='intestine';update()}).catch(e=>caption.textContent='画面加载失败：'+e.message);
</script></html>
