</style><header><h1>器官战场 · 全身地图验证</h1><span>原图坐标 · 器官特点 · 真实 Lua 移动</span><a href="organ-atlas-review.html">12 张地图与移动预览</a></header><div class="toolbar"><select id="organPick" aria-label="选择器官"></select><button id="fit">完整器官</button><button id="whole">全身位置</button><button id="z015">0.15 指挥</button><button id="minus">−</button><button id="plus">＋</button><button id="all">本区全选</button><button id="stop">停止</button><button id="pause">暂停</button><button id="reset">重置</button><select id="plane"><option value="0">组织地面</option><option value="blood">血管内</option></select><select id="roomPick" aria-label="定位组织房间"><option value="" selected disabled>定位房间</option></select><span id="zoomLabel"></span></div><main><div id="stage"><canvas id="map"></canvas><div id="badge">正在接入实际移动代码…</div></div><aside><h2 id="organTitle">组织分区</h2><p id="features"></p><div class="rooms" id="rooms"></div><label><input id="routes" type="checkbox" checked>显示所选细胞的路线</label><label><input id="bounds" type="checkbox">显示实际墙面与边界</label><p>点细胞选中；Shift 可追加。点地面派遣，右键同样可以移动。拖动空白处平移，滚轮或双指缩放。</p><p>各器官沿原图轮廓布置。不同颜色的组织地面可以行走；描边隔断、食物、空气和尿液的专用通路按实际碰撞区分。只通过明确的膜口进入血管。</p><p id="status"></p><small>浏览器运行真实 Lua 寻路与碰撞；画面由 Canvas 展示。原生 NanoVG 的帧率仍需独立验收。</small><p id="error"></p></aside></main><script src="organ-atlas.js"></script></html>
